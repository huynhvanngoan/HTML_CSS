<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Elements</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="control">
        <button type="all">All</button>
        <button type="salad">Salad</button>
        <button type="meat">Meat</button>
        <button type="drink">Drink</button>
        <button type="dessert">Dessert</button>
    </div>
    
    <div class="container">
        <img src="./images/dessert1.jpg" alt="" type="dessert">
        <img src="./images/drinks1.jpg" alt="" type="drink">
        <img src="./images/drinks2.jpg" alt="" type="drink">
        <img src="./images/drinks3.jpg" alt="" type="drink">
        <img src="./images/meat1.jpg" alt="" type="meat">
        <img src="./images/meat2.jpg" alt="" type="meat">
        <img src="./images/salad1.jpg" alt="" type="salad">
        <img src="./images/salad2.jpg" alt="" type="salad">
    </div>
</body>

<script src="main.js"></script>

</html>
